# Showcase stack: Lore + Postgres on ports 4747 (web) / 4748 (MCP), LLM and embeddings
# from Ollama on the host. Run from this directory: docker compose up -d --build
name: lore-showcase
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lore
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore -d lore"]
      interval: 5s
      timeout: 5s
      retries: 5

  lore:
    build: ../..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lore:lore@postgres:5432/lore
      LORE_API_KEY: ${LORE_API_KEY:?set LORE_API_KEY in examples/showcase/.env}
      LORE_ADMIN_LOGIN: ${LORE_ADMIN_LOGIN:-admin}
      LORE_ADMIN_PASSWORD: ${LORE_ADMIN_PASSWORD:?set LORE_ADMIN_PASSWORD in examples/showcase/.env}
      LORE_COOKIE_SECURE: "false"
      LORE_ALLOWED_ORIGINS: http://localhost:4747,http://127.0.0.1:4747
      LORE_PORT: "4737"
      LORE_MCP_PORT: "4738"
      LORE_MCP_HOST: 0.0.0.0
      LORE_MCP_ALLOWED_HOSTS: localhost:4748,127.0.0.1:4748
      LORE_MCP_PUBLIC_URL: http://localhost:4748/mcp
      LORE_EMBEDDING_PROVIDER: ollama
      LORE_OLLAMA_URL: http://host.docker.internal:11434
      LORE_OLLAMA_MODEL: nomic-embed-text
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LORE_STORAGE_PATH: /app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4747:4737"
      - "127.0.0.1:4748:4738"
    volumes:
      - lore_storage:/app/storage

volumes:
  postgres_data:
  lore_storage:

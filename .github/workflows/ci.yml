name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lore
          POSTGRES_PASSWORD: lore
          POSTGRES_DB: lore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lore -d lore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests are fully offline: no OpenAI key, hash embeddings (see vitest.config.ts)
      DATABASE_URL: postgres://lore:lore@localhost:5432/lore
      LORE_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Generator dry run
        run: npx tsx examples/generator/generate.ts --spec examples/generator/petstore.openapi.json --service petstore-api --out /tmp/generated --dry-run

  e2e:
    runs-on: ubuntu-24.04 # Playwright 1.59 has no browser builds for ubuntu-latest (26.04) yet
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lore
          POSTGRES_PASSWORD: lore
          POSTGRES_DB: lore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lore -d lore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lore:lore@localhost:5432/lore
      LORE_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lore:ci .
